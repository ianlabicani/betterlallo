<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OG Image Template</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: linear-gradient(135deg, #0066eb 0%, #0052bc 100%);
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        color: white;
        box-sizing: border-box;
      }

      .container {
        display: grid;
        grid-template-columns: 440px 1fr;
        align-items: center;
        gap: 44px;
        width: 100%;
      }

      .brand-image {
        display: block;
        width: 440px;
        height: 440px;
        object-fit: contain;
        border-radius: 32px;
      }

      .copy {
        text-align: left;
      }

      .title {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .subtitle {
        font-size: 24px;
        opacity: 0.9;
        margin-bottom: 10px;
      }

      .description {
        font-size: 18px;
        opacity: 0.8;
        max-width: 600px;
        line-height: 1.4;
      }

      .badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <img
        class="brand-image"
        src="./better-lallo-logo.png"
        alt=""
      />
      <div class="copy">
        <div class="title">BetterLal-lo</div>
        <div class="subtitle">Civic information for Lal-lo, Cagayan</div>
        <div class="description">
          Find public services, local offices, barangays, and transparency
          sources in one community portal.
        </div>
        <div class="badge">Municipality of Lal-lo · Cagayan Valley</div>
      </div>
    </main>
  </body>
</html>
