<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>BetterLal-lo | Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #f0fdfa;
        color: #17332f;
      }
      main {
        box-sizing: border-box;
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
      }
      .card {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        padding: 1.5rem;
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.08);
      }
      h1 {
        margin-top: 0;
        color: #115e59;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p>BetterLal-lo civic information portal</p>
        <h1>You are offline</h1>
        <p>
          The page could not be loaded while the network is unavailable. Try
          again when you are connected.
        </p>
        <p>
          Previously visited pages may still be available from your browser
          cache.
        </p>
        <a href="/">Return to BetterLal-lo</a>
      </div>
    </main>
  </body>
</html>
