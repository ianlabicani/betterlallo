# Government Services Data
# This file contains all the service categories for the government portal
# Each category's index.yaml file is automatically located at content/services/{slug}/index.yaml
# Non-technical users can easily edit this file to add, remove, or modify service categories

categories:
  # Health Services
  - category: 'Health Services'
    slug: 'health-services'
    description: 'Find verified health-service references, local referrals, and public-health information for Lal-lo.'
    icon: 'Heart'

  # Education Services
  - category: 'Education'
    slug: 'education'
    description: 'Find official references for education assistance, scholarships, daycare, and school-related announcements.'
    icon: 'GraduationCap'

  # Business & Livelihood Services
  - category: 'Business and Livelihood'
    slug: 'business'
    description: 'Start with a source-first checklist for business permits, clearances, taxes, and livelihood support.'
    icon: 'Building2'

  # Social Welfare Services
  - category: 'Social Welfare'
    slug: 'social-welfare'
    description: 'Find how to verify assistance and referrals for older persons, PWDs, solo parents, families, and emergencies.'
    icon: 'Users'

  # Agriculture & Fisheries Services
  - category: 'Agriculture & Fisheries'
    slug: 'agriculture-fisheries'
    description: 'Find the right office for agricultural inputs, fisheries support, veterinary concerns, training, and referrals.'
    icon: 'Wheat'

  # Infrastructure & Public Works Services
  - category: 'Infrastructure & Public Works'
    slug: 'infrastructure-public-works'
    description: 'Learn what to record and where to start when reporting roads, drainage, water, or public-facility concerns.'
    icon: 'Wrench'

  # Garbage and Waste Disposal Services
  - category: 'Garbage and Waste Disposal'
    slug: 'garbage-waste-disposal'
    description: 'Find practical guidance for local collection information, segregation, special waste, and reporting concerns.'
    icon: 'Trash2'

  # Environment Services
  - category: 'Environment'
    slug: 'environment'
    description: 'Find verified environmental programs and the proper local or national reporting channel for concerns.'
    icon: 'TreePine'

  # Disaster Preparedness Services
  - category: 'Disaster Preparedness'
    slug: 'disaster-preparedness'
    description: 'Find current emergency references, disaster-preparedness guidance, and official Cagayan response channels.'
    icon: 'Shield'

  # Housing & Land Use Services
  - category: 'Housing & Land Use'
    slug: 'housing-land-use'
    description: 'Confirm zoning, building, occupancy, housing, and land-use requirements before applying or building.'
    icon: 'Home'

  # Certificates and Civil Registry
  - category: 'Certificates & Vital Records'
    slug: 'certificates'
    description: 'Find source-backed guidance for civil-registry records, certificates, and local clearance questions.'
    icon: 'FileCheck2'

  # Taxes and payments
  - category: 'Tax Payments'
    slug: 'tax-payments'
    description: 'Start with verified references for municipal taxes, real property tax, receipts, and payment questions.'
    icon: 'Receipt'

  # Barangay services
  - category: 'Barangay Services'
    slug: 'barangay-services'
    description: 'Prepare for barangay clearances and local requests while keeping unpublished fees and requirements clearly pending.'
    icon: 'Landmark'
